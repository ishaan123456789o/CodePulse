name: codepulse
x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-codepulse}:${POSTGRES_PASSWORD:-codepulse-local}@postgres:5432/${POSTGRES_DB:-codepulse}
  REDIS_URL: redis://redis:6379/0
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  DEMO_MODE: ${DEMO_MODE:-false}
  OPTIONAL_ACTIVITY_ENABLED: ${OPTIONAL_ACTIVITY_ENABLED:-false}
  SUMMARY_CACHE_SECONDS: ${SUMMARY_CACHE_SECONDS:-30}
  DISCOVERY_LANGUAGES: ${DISCOVERY_LANGUAGES:-[]}
  DISCOVERY_EXTRA_QUERIES: ${DISCOVERY_EXTRA_QUERIES:-[]}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  DISCOVERY_REQUEST_BUDGET: ${DISCOVERY_REQUEST_BUDGET:-10}
  TRACKING_REQUEST_BUDGET: ${TRACKING_REQUEST_BUDGET:-60}
  DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-21600}
  TRACK_HIGH_HOURS: ${TRACK_HIGH_HOURS:-1}
  TRACK_NORMAL_HOURS: ${TRACK_NORMAL_HOURS:-6}
  TRACK_LOW_HOURS: ${TRACK_LOW_HOURS:-24}
  GITHUB_MIN_INTERVAL_SECONDS: ${GITHUB_MIN_INTERVAL_SECONDS:-2}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codepulse}
      POSTGRES_USER: ${POSTGRES_USER:-codepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codepulse-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build: ./apps/api
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: ./apps/api
    environment: *api-environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: infra/docker/worker.Dockerfile}
    environment: *api-environment
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  beat:
    build: {context: ., dockerfile: infra/docker/worker.Dockerfile}
    environment: *api-environment
    command: ["celery", "-A", "app.workers.tasks:celery", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
